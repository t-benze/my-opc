name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python-unit:
    name: Python unit (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    # No Python linter configured in-repo; add ruff via founder approval to enable Python lint.
    strategy:
      fail-fast: false
      matrix:
        # PR CI: fast feedback on 3.14 only.
        # Push to main: full 3.12/3.13/3.14 matrix.
        # Matrix dimensions justified by pyproject requires-python = ">=3.12,<3.15".
        python-version: ${{ github.event_name == 'pull_request' && fromJSON('["3.14"]') || fromJSON('["3.12", "3.13", "3.14"]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: Sync dependencies (frozen)
        run: uv sync --frozen
      # pyproject addopts = -m 'not integration', so this default run is unit-only.
      # -n 4 matches the standard GitHub-hosted runner's vCPU count; validated
      # locally as flake-free (higher worker counts induced contention in a
      # couple of real-subprocess timeout tests).
      - name: Run unit tests
        run: uv run pytest tests/ -v -n 4

  web:
    name: Web (Node 24)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Design-system colour gate
        run: bash scripts/verify-design-system-colour-gate.sh
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Build Storybook
        run: npm run build-storybook
      # Bare `vitest` is watch mode and would hang CI; `vitest run` is non-watch.
      - name: Test (non-watch)
        run: npx vitest run

  # ── Linux canonical skill store validation (same-owner, unconditional) ──
  # Runs the production canonical-store boundary against the real Linux
  # adapter rather than relying only on the unit-suite launch double.
  linux-canonical-validation:
    name: Linux Canonical Store Validation (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
          python-version: "3.14"

      - name: Sync dependencies
        run: uv sync --frozen --group build

      - name: Managed Linux package shipping seam
        run: |
          set -eux
          package_tmp="$(mktemp -d)"
          trap 'rm -rf "$package_tmp"' EXIT
          (cd app/linux/tsnet-sidecar && go test ./... && GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -buildvcs=false -o "$package_tmp/happyranch-tsnet-sidecar" ./cmd/happyranch-tsnet-sidecar)
          uv build --wheel --out-dir "$package_tmp"
          wheel="$(find "$package_tmp" -maxdepth 1 -name 'happyranch-*.whl' -print -quit)"
          uv run python app/linux/package/build_connector.py --wheel "$wheel" --output "$package_tmp/happyranch-connector"
          (cd "$package_tmp" && ./happyranch-connector --help)
          uv run python app/linux/package/build_package.py --sidecar "$package_tmp/happyranch-tsnet-sidecar" --connector "$package_tmp/happyranch-connector" --wheel "$wheel" --version ci --output "$package_tmp/happyranch-linux-amd64.tar"
          PACKAGE_TMP="$package_tmp" uv run python -c 'from pathlib import Path; from runtime.remote_access.linux_package import install_linux_package; import os; root=Path(os.environ["PACKAGE_TMP"])/"fixture-root"; install_linux_package(Path(os.environ["PACKAGE_TMP"])/"happyranch-linux-amd64.tar", root); print(root)'

      - name: Run canonical store + validation tests
        env:
          HAPPYRANCH_DAEMON_HOME: /tmp/happyranch-ci
          HAPPYRANCH_TEST_REAL_PLATFORM: "1"
        run: |
          set -eux
          uv run pytest \
            tests/test_canonical_skill_store.py \
            tests/test_canonical_production_bound.py \
            tests/test_skill_cutover_completeness.py \
            tests/test_thr070_skill_freshness.py \
            tests/test_system_contract_materialization.py \
            tests/test_workspace_adapters.py \
            tests/test_prelaunch_integrity_validation.py \
            -v --tb=short

      - name: Run real daemon + executor smoke test
        env:
          HAPPYRANCH_DAEMON_HOME: /tmp/happyranch-ci-smoke
          HAPPYRANCH_TEST_REAL_PLATFORM: "1"
        run: >-
          uv run pytest -m integration
          tests/integration/test_end_to_end.py::test_register_and_run_completes_via_codex_callback
          -v --tb=short

  managed-n3-real-systemd:
    name: Managed N3 Real systemd (Ubuntu 24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
          python-version: "3.14"
      - name: Sync build dependencies
        run: uv sync --frozen --group build
      - name: Build actual package
        run: |
          set -euo pipefail
          package_tmp="$(mktemp -d)"
          echo "PACKAGE_TMP=$package_tmp" >> "$GITHUB_ENV"
          (cd app/linux/tsnet-sidecar && go test ./... && GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -buildvcs=false -o "$package_tmp/happyranch-tsnet-sidecar" ./cmd/happyranch-tsnet-sidecar)
          uv build --wheel --out-dir "$package_tmp"
          wheel="$(find "$package_tmp" -maxdepth 1 -name 'happyranch-*.whl' -print -quit)"
          uv run python app/linux/package/build_connector.py --wheel "$wheel" --output "$package_tmp/happyranch-connector"
          uv run python app/linux/package/build_package.py --sidecar "$package_tmp/happyranch-tsnet-sidecar" --connector "$package_tmp/happyranch-connector" --wheel "$wheel" --version ci --output "$package_tmp/happyranch-linux-amd64.tar"
      - name: Exercise actual packaged composite against pinned Headscale and peer
        env:
          PACKAGE_TAR: ${{ env.PACKAGE_TMP }}/happyranch-linux-amd64.tar
          PROOF_SUBJECT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          N3_DIAGNOSTICS_DIR: ${{ runner.temp }}/managed-n3-evidence
        run: app/linux/package/real_systemd_n3.sh
      - name: Validate successful Managed N3 execution artifact
        if: success()
        run: python app/linux/package/n3_evidence.py validate "${{ runner.temp }}/managed-n3-evidence/execution-evidence.json" --expected-subject "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Upload Managed N3 execution evidence and diagnostics
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: managed-n3-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/managed-n3-evidence
          if-no-files-found: error

  # ── macOS canonical skill store validation (same-owner, unconditional) ──
  # Executor and daemon share the same OS identity — same-owner is the only
  # supported delivery mode. No distinct-account provisioning or sudo.
  # This job verifies deterministic canonical-store behavior on real macOS.
  macos-canonical-validation:
    name: macOS Canonical Store Validation (macOS 15)
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
          python-version: "3.14"

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Run canonical store + validation tests
        env:
          HAPPYRANCH_DAEMON_HOME: /tmp/happyranch-ci
        run: |
          set -eux
          # Run canonical store and validation test suites on real macOS.
          # These tests verify:
          # - Canonical store build, hash-addressing, path-traversal rejection
          # - Symlink materializer create/repair/withdrawal
          # - Platform identity checks (same-owner: executor == daemon uid)
          # - Direct executor launch under daemon identity
          # - Cutover completeness (no legacy copy remains)
          # - Skill freshness (31 tests)
          # - Per-launch/retry pre-Popen integrity validation
          # - Hardening failure compensation (no executor launch)
          # - Same-owner adversarial limits (detection, not prevention)
          uv run pytest \
            tests/test_canonical_skill_store.py \
            tests/test_canonical_production_bound.py \
            tests/test_skill_cutover_completeness.py \
            tests/test_thr070_skill_freshness.py \
            tests/test_system_contract_materialization.py \
            tests/test_workspace_adapters.py \
            tests/test_prelaunch_integrity_validation.py \
            -v --tb=short
